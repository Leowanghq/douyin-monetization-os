<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音变现操作系统</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161b22;
    --border: #2a3038;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #22c55e;
    --user: #1f6feb;
    --run: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .tag { font-size: 12px; color: var(--muted); }
  #quick {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  #quick button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 16px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  #quick button:hover { border-color: var(--accent); }
  #quick button.run { background: var(--run); color: #000; font-weight: 600; }
  main {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 14px; overflow-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user); border-color: var(--user); }
  .msg.assistant .bubble { background: var(--panel); }
  .bubble p { margin: 6px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; font-size: 15px; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble code {
    background: #21262d; padding: 1px 5px; border-radius: 4px; font-size: 13px;
  }
  .bubble pre {
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow-x: auto; font-size: 13px;
  }
  .bubble pre code { background: none; padding: 0; }
  footer {
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  #input {
    flex: 1; background: #0d1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; resize: none;
    font-family: inherit; min-height: 42px;
  }
  #send {
    background: var(--accent); color: #000; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .thinking .bubble { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🎬 抖音变现操作系统</h1>
  <span class="tag" id="model">本地 Ollama · 数据不出本机</span>
</header>

<div id="quick">
  <button data-cmd="/douyin">📋 菜单</button>
  <button data-cmd="/douyin run" class="run">⚡ 一键生成方案</button>
  <button data-cmd="/douyin roadmap">①定位</button>
  <button data-cmd="/douyin niche">②细分</button>
  <button data-cmd="/douyin viral">③爆款</button>
  <button data-cmd="/douyin algo">④算法</button>
  <button data-cmd="/douyin produce">⑤制作</button>
  <button data-cmd="/douyin monetize">⑥变现</button>
  <button data-cmd="/douyin analyze">⑦分析</button>
  <button data-cmd="/douyin plan90">⑧执行</button>
  <button data-cmd="/douyin status">📊 状态</button>
  <button data-cmd="/douyin off">🚪 退出专家</button>
</div>

<main id="chat"></main>

<footer>
  <textarea id="input" rows="2" placeholder="输入问题，或点上方快捷按钮…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMarkdown(text) {
    if (typeof marked !== 'undefined' && marked.parse) {
      try { return marked.parse(text); } catch (e) {}
    }
    return '<pre style="white-space:pre-wrap;word-break:break-word;margin:0;font-family:inherit">'
      + escapeHtml(text) + '</pre>';
  }

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(text);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function setThinking(on) {
    sendBtn.disabled = on;
    if (on) {
      const t = document.createElement('div');
      t.className = 'msg assistant thinking';
      t.id = 'thinking';
      t.innerHTML = '<div class="bubble">思考中…</div>';
      chat.appendChild(t);
      chat.scrollTop = chat.scrollHeight;
    } else {
      const t = document.getElementById('thinking');
      if (t) t.remove();
    }
  }

  async function send(text) {
    if (!text || sendBtn.disabled) return;
    addMessage('user', text);
    setThinking(true);
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await resp.json();
      setThinking(false);
      addMessage('assistant', data.reply || '（无回复）');
    } catch (e) {
      setThinking(false);
      addMessage('assistant', '❌ 请求失败：' + e);
    }
  }

  document.querySelectorAll('#quick button').forEach(btn => {
    btn.addEventListener('click', () => send(btn.dataset.cmd));
  });

  sendBtn.addEventListener('click', () => { send(input.value.trim()); input.value = ''; });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
  });

  // 欢迎语
  addMessage('assistant', '你好！我是抖音变现操作系统。\n\n'
    + '点上方 **⚡ 一键生成方案** 直接出完整方案；或先点 **①定位**、**②细分** 等模块一步步来。\n\n'
    + '也可以直接输入问题，例如：`帮我分析家居收纳赛道并给 20 个选题`。');
</script>
</body>
</html>
